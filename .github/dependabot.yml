
version: 2

updates:
  # Group names matter: check.yml auto-merges PRs from groups ending in
  # "-patch". Minor groups and majors (ungrouped) stay manual.

  - package-ecosystem: composer
    directory: /
    # Assigned PRs make GitHub email these people.
    assignees: ["GuidoOffermans", "inanamm"]
    schedule:
      interval: daily

    # Composer patches: no cooldown.
    # Explicitly exempt Kirby to address the observed issue.
    # Minor and major updates: 3-day cooldown.
    cooldown:
      default-days: 3
      semver-patch-days: 0
      exclude:
        - "getkirby/*"

    groups:
      kirby-patch:
        patterns: ["getkirby/*"]
        update-types: [patch]

      kirby-minor:
        patterns: ["getkirby/*"]
        update-types: [minor]

      composer-patch:
        patterns: ["*"]
        exclude-patterns: ["getkirby/*"]
        update-types: [patch]

      composer-minor:
        patterns: ["*"]
        exclude-patterns: ["getkirby/*"]
        update-types: [minor]

  - package-ecosystem: npm
    directory: /
    # Assigned PRs make GitHub email these people.
    assignees: ["GuidoOffermans", "inanamm"]
    schedule:
      interval: daily

    # Keep the 3-day cooldown for npm.
    cooldown:
      default-days: 3

    groups:
      npm-patch:
        update-types: [patch]

      npm-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    # Assigned PRs make GitHub email these people.
    assignees: ["GuidoOffermans", "inanamm"]
    schedule:
      interval: monthly
