
version: 2

updates:
  # Group names matter: check.yml auto-merges PRs from groups ending in
  # "-patch". Minor groups and majors (ungrouped) stay manual.

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily

    # Composer patches: no cooldown.
    # Explicitly exempt Kirby to address the observed issue.
    # Minor and major updates: 3-day cooldown.
    cooldown:
      default-days: 3
      semver-patch-days: 0
      exclude:
        - "getkirby/*"

    groups:
      kirby-patch:
        patterns: ["getkirby/*"]
        update-types: [patch]

      kirby-minor:
        patterns: ["getkirby/*"]
        update-types: [minor]

      composer-patch:
        patterns: ["*"]
        exclude-patterns: ["getkirby/*"]
        update-types: [patch]

      composer-minor:
        patterns: ["*"]
        exclude-patterns: ["getkirby/*"]
        update-types: [minor]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

    # Keep the 3-day cooldown for npm.
    cooldown:
      default-days: 3

    groups:
      npm-patch:
        update-types: [patch]

      npm-minor:
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Patches for the live branch itself, so live gets fixes even when main has
  # unreleased work. Auto-merged and deployed to live by check.yml.
  - package-ecosystem: composer
    directory: /
    target-branch: live
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      semver-patch-days: 0
      exclude:
        - "getkirby/*"
    groups:
      kirby-patch:
        patterns: ["getkirby/*"]
        update-types: [patch]
      composer-patch:
        patterns: ["*"]
        exclude-patterns: ["getkirby/*"]
        update-types: [patch]
    # Only patches here; minors and majors reach live through main.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
