name: LIVE Deploy website on push

on:
  push:
    branches: ["live"]

jobs:
  deploy:
    uses: slothiestudio/kirby-workflows/.github/workflows/deploy.yml@v1.5.1
    with:
      environment: Live
      php-version: "8.4"
    # Passed by name: secrets: inherit doesn't work across organizations.
    secrets:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      PASSWORD: ${{ secrets.PASSWORD }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
