name: PREVIEW Deploy website on push

on:
  push:
    branches: ["main"]
  # Started by the Dependabot auto-merge in check.yml (merges made by
  # workflows don't fire push events).
  workflow_dispatch:

jobs:
  deploy:
    uses: slothiestudio/kirby-workflows/.github/workflows/deploy.yml@v1.0.0
    with:
      environment: preview
      php-version: "8.4"
