on:
  push:
    branches: ["main"]
  # Also triggered by the Dependabot auto-merge job in check.yml: merges made
  # with GITHUB_TOKEN don't fire push events, so it dispatches this directly.
  workflow_dispatch:

name: PREVIEW Deploy website on push

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      php-version: "8.4"
      # Paths to exclude on this server only, on top of the shared list in deploy.yml.
      exclude: ""
    secrets: inherit
